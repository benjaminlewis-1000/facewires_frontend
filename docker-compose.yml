# version: "3.3"
services:

  # ==============================================================
  # PRODUCTION SETUP
  # ==============================================================
  # Builds a static Vite production bundle and serves it with `serve`
  # (Dockerfile.prod) - no bind-mounted source, no live dev server, no
  # chokidar polling. A deploy is: pull the latest code into this
  # checkout, then `docker-compose up -d --build picasa_frontend` to
  # rebuild the image from it and restart the container. This service is
  # meant to be run from the separate production checkout
  # (/home/benjamin/git_repos/facewires_frontend, mirroring how
  # django_picasa/django_picasa_dev split dev vs prod for the backend) -
  # `context: .` resolves relative to wherever this file actually lives,
  # so the same docker-compose.yml works unmodified from either checkout.
  picasa_frontend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: picasa_frontend_img
    container_name: picasa_frontend
    ports:
     - 8081:3000
    networks:
      - traefik_proxy
    restart: always

  # ==============================================================
  # DEVELOPMENT SETUP
  # ==============================================================
  picasa_frontend_dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: picasa_frontend_dev_img
    container_name: picasa_frontend_dev
    env_file:
      - .env
    # Bypassing the PM2 script for dev, utilizing Vite's native server directly
    command: npm start
    environment:
      - DOCKER_HOST_IP=${HOST_IP} 
      - CHOKIDAR_USEPOLLING=true
    ports:
     - 8092:3000
    volumes:
      - '/app/node_modules'
      - /home/benjamin/git_repos/dev_facewire/:/app
    networks:
      - traefik_proxy
    # unless-stopped is generally better for dev environments than always
    restart: unless-stopped

networks:
  default: 
    driver: bridge
  traefik_proxy:
    external: true
