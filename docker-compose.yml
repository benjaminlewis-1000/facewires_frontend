  # ==============================================================
  # DEVELOPMENT SETUP
  # ==============================================================
  picasa_frontend_dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: picasa_frontend_dev_img
    container_name: picasa_frontend_dev
    env_file:
      - .env
    # Bypassing the PM2 script for dev, utilizing Vite's native server directly
    command: npm start
    environment:
      - DOCKER_HOST_IP=${HOST_IP} 
      - CHOKIDAR_USEPOLLING=true
    ports:
     - 8092:3000
    volumes:
      - '/app/node_modules'
      - /home/benjamin/git_repos/dev_facewire/:/app
    networks:
      - traefik_proxy
    # unless-stopped is generally better for dev environments than always
    restart: unless-stopped

networks:
  default: 
    driver: bridge
  traefik_proxy:
    external: true
